highlights:
  - id: transparent-brand-architecture
    engagement_id: product-unified-frontend
    title: Transparent Frontend Architecture Across Two Brands
    summary: To deliver two travel brands from one technical platform, I isolated brand differences in design tokens and maximized shared feature implementation.
    principles:
      - Expressed brand color, typography, and CTA decisions as design tokens
      - Built CSS architecture that applied transparently to both brands through token switching
      - Used component-based layered design organized around functional cohesion
      - Localized implementation differences across desktop, mobile, and brands
  - id: bff-spa-modernization
    engagement_id: product-spa-modernization
    title: Incremental Migration from a Legacy Platform to BFF / SPA
    summary: To improve content discovery, I migrated a monolithic legacy platform to a Nuxt.js BFF / SPA architecture while preserving SEO.
    principles:
      - Combined SSR and SPA behavior to balance SEO with client-side experience
      - Replaced the platform incrementally, beginning with primary user journeys
      - Led architecture decisions, code reviews, and designer collaboration
