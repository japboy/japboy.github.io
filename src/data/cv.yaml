statement:
  heading: The Open Web and Repeatable Design
  paragraphs:
    - I became interested in web standards through the principle that HTML describes information and structure while CSS describes presentation. That led to a lasting respect for the Web as an open platform where information can be accessed equally.
    - I have contributed where I could, including translating official Git documentation, localizing open-source software, and testing macOS builds for an open-source editor.
    - Today I focus on systems that let organizations reproduce coherent UI and UX. By articulating the non-verbal parts of design and connecting component architecture, software design, and domain modeling, I aim to improve both consistency and development productivity.
